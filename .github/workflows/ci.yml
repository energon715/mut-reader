name: Desktop checks
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config
      - run: npm ci && npm run check && npm run build && npm audit --audit-level=high
        working-directory: frontend
      - run: go vet -tags webkit2_41 ./... && go test -race -tags webkit2_41 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -tags webkit2_41 ./...
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
      - run: wails generate module -tags webkit2_41 && wails build -tags webkit2_41 -skipbindings -o mut
      - run: go build -trimpath -o build/bin/vaultctl ./cmd/vaultctl
      - run: python3 scripts/collect-licenses.py && python3 scripts/package-linux.py && python3 scripts/verify-package.py
      - uses: actions/upload-artifact@v4
        with:
          name: mut-linux-amd64-rc
          path: dist/
